<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --paper: #e9f0ef;
      --paper-raised: #f8fbfa;
      --ink: #17253d;
      --muted: #64717d;
      --rule: #c6d3d4;
      --accent: #126e87;
      --accent-soft: #d8e9eb;
      --signal: #e1ad32;
      --code: #111b2c;
      --code-ink: #dce9ed;
      --shadow: 0 24px 70px rgba(25, 49, 67, 0.14);
      --serif: Charter, Cambria, Georgia, serif;
      --sans: Bahnschrift, "Arial Narrow", "Franklin Gothic Medium", sans-serif;
      --mono: "Cascadia Code", Consolas, monospace;
    }

    [data-theme="dark"] {
      --paper: #101827;
      --paper-raised: #172238;
      --ink: #edf4f3;
      --muted: #aab8c1;
      --rule: #34475a;
      --accent: #65bfd0;
      --accent-soft: #203d4a;
      --signal: #f0c45b;
      --code: #0a101c;
      --code-ink: #deebee;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(120deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent 42%),
        linear-gradient(color-mix(in srgb, var(--rule) 28%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--rule) 28%, transparent) 1px, transparent 1px),
        var(--paper);
      background-size: auto, 32px 32px, 32px 32px, auto;
      font-family: var(--serif);
      line-height: 1.72;
    }

    .progress {
      position: fixed;
      inset: 0 auto auto 0;
      z-index: 20;
      width: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--signal), var(--accent));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      min-height: 58px;
      padding: 0.6rem clamp(1rem, 3vw, 2.5rem);
      border-bottom: 1px solid color-mix(in srgb, var(--rule) 80%, transparent);
      background: color-mix(in srgb, var(--paper) 86%, transparent);
      backdrop-filter: blur(14px);
      font-family: var(--sans);
    }

    .brand { display: flex; align-items: center; gap: 0.7rem; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .brand-mark { width: 12px; height: 12px; background: var(--signal); transform: rotate(45deg); }
    .actions { display: flex; gap: 0.45rem; }
    button {
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 0.48rem 0.78rem;
      color: var(--ink);
      background: var(--paper-raised);
      font: 600 0.78rem/1 var(--sans);
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    :focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }

    .page {
      display: grid;
      grid-template-columns: minmax(190px, 260px) minmax(0, 780px);
      gap: clamp(2rem, 6vw, 6rem);
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(3rem, 7vw, 7rem) 0 7rem;
    }

    aside { position: relative; }
    .toc-panel { position: sticky; top: 88px; max-height: calc(100vh - 115px); overflow: auto; padding-right: 1rem; }
    .eyebrow { margin: 0 0 1rem; color: var(--signal); font: 700 0.7rem/1 var(--sans); letter-spacing: 0.17em; text-transform: uppercase; }
    .toc-link { display: block; margin: 0.2rem 0; padding: 0.28rem 0.65rem; border-left: 2px solid transparent; color: var(--muted); font: 0.82rem/1.35 var(--sans); text-decoration: none; }
    .toc-link:hover, .toc-link.active { border-left-color: var(--accent); color: var(--accent); }
    .toc-level-2 { padding-left: 1.15rem; }
    .toc-level-3 { padding-left: 1.8rem; font-size: 0.76rem; }
    .toc-empty { color: var(--muted); font: italic 0.85rem var(--serif); }

    article {
      min-width: 0;
      padding: clamp(2rem, 5vw, 5rem);
      border: 1px solid color-mix(in srgb, var(--rule) 72%, transparent);
      background: color-mix(in srgb, var(--paper-raised) 96%, transparent);
      box-shadow: var(--shadow);
    }

    .document-header { margin-bottom: 4rem; padding-bottom: 2rem; border-bottom: 1px solid var(--rule); }
    .kicker { margin: 0 0 1.5rem; color: var(--accent); font: 700 0.72rem/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; }
    .document-title { max-width: 15ch; margin: 0; font-family: var(--sans); font-size: clamp(2.8rem, 8vw, 6.4rem); font-stretch: condensed; font-weight: 700; letter-spacing: -0.055em; line-height: 0.9; }
    .subtitle { margin: 1.5rem 0 0; color: var(--muted); font: 1.05rem/1.5 var(--sans); }
    .meta { display: flex; flex-wrap: wrap; gap: 0.6rem 1.2rem; margin-top: 1.8rem; color: var(--muted); font: 0.77rem/1.4 var(--sans); }
    .meta span::before { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 0.5rem 0.08rem 0; border-radius: 50%; background: var(--signal); }

    .content h1, .content h2, .content h3, .content h4 { scroll-margin-top: 86px; color: var(--ink); line-height: 1.12; }
    .content h1 { margin: 4rem 0 1.2rem; font-size: clamp(2.2rem, 5vw, 3.6rem); letter-spacing: -0.035em; }
    .content h2 { margin: 3.5rem 0 1rem; font-size: clamp(1.7rem, 3.5vw, 2.4rem); letter-spacing: -0.025em; }
    .content h3 { margin: 2.7rem 0 0.8rem; font: 700 1.12rem/1.3 var(--sans); letter-spacing: 0.01em; }
    .heading-anchor { color: inherit; text-decoration: none; }
    .heading-anchor:hover { color: var(--accent); }
    .content p { margin: 1rem 0 1.35rem; }
    .content a { color: var(--accent); text-underline-offset: 0.18em; }
    .content strong { font-weight: 700; }
    .content hr { width: 42%; margin: 3.8rem auto; border: 0; border-top: 1px solid var(--rule); }
    .content blockquote { margin: 2rem 0; padding: 0.5rem 1.5rem; border-left: 4px solid var(--signal); background: color-mix(in srgb, var(--signal) 6%, transparent); font-size: 1.08rem; font-style: italic; }
    .content ul, .content ol { padding-left: 1.45rem; }
    .content li { margin: 0.45rem 0; padding-left: 0.3rem; }
    .content li::marker { color: var(--signal); font-family: var(--sans); font-weight: 700; }
    .task-item { display: flex; align-items: flex-start; gap: 0.5rem; margin-left: -1.25rem; list-style: none; }
    .task-item input { margin-top: 0.42rem; accent-color: var(--accent); }
    .content :not(pre) > code { padding: 0.12rem 0.34rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--accent-soft); font: 0.86em var(--mono); }

    .code-shell { margin: 1.8rem 0; overflow: hidden; border-radius: 8px; background: var(--code); color: var(--code-ink); }
    .code-bar { display: flex; justify-content: space-between; align-items: center; padding: 0.55rem 0.75rem 0.2rem 1rem; color: color-mix(in srgb, var(--code-ink) 68%, transparent); font: 0.68rem/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; }
    .code-bar button { border-color: color-mix(in srgb, var(--code-ink) 20%, transparent); padding: 0.35rem 0.6rem; color: var(--code-ink); background: transparent; }
    pre { margin: 0; padding: 1rem 1.2rem 1.35rem; overflow: auto; font: 0.84rem/1.65 var(--mono); tab-size: 2; }

    .table-wrap { margin: 2rem 0; overflow-x: auto; border: 1px solid var(--rule); }
    table { width: 100%; border-collapse: collapse; font: 0.88rem/1.5 var(--sans); }
    th, td { padding: 0.75rem 0.9rem; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
    th { background: var(--accent-soft); color: var(--accent); font-size: 0.72rem; letter-spacing: 0.07em; text-transform: uppercase; }
    tbody tr:last-child td { border-bottom: 0; }

    .footer { margin-top: 5rem; padding-top: 1.3rem; border-top: 1px solid var(--rule); color: var(--muted); font: 0.75rem/1.5 var(--sans); }

    @media (max-width: 780px) {
      .page { display: block; width: min(100% - 1rem, 780px); padding-top: 1rem; }
      aside { display: none; }
      article { padding: clamp(1.4rem, 6vw, 2.5rem); }
      .document-header { margin-bottom: 2.8rem; }
      .document-title { font-size: clamp(2.5rem, 15vw, 4.6rem); }
      table { min-width: 620px; }
      .action-label { display: none; }
    }

    @media print {
      body { background: white; color: black; }
      .topbar, aside, .progress, .copy-code { display: none !important; }
      .page { display: block; width: 100%; padding: 0; }
      article { padding: 0; border: 0; box-shadow: none; }
      .code-shell { break-inside: avoid; }
      a { color: inherit !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span><span>Longform Reader</span></div>
    <div class="actions">
      <button type="button" id="themeButton" aria-label="Toggle color theme"><span class="action-label">Theme</span> ◐</button>
      <button type="button" onclick="window.print()"><span class="action-label">Print</span> ↗</button>
    </div>
  </header>

  <main class="page">
    <aside aria-label="Table of contents">
      <nav class="toc-panel">
        <p class="eyebrow">On this page</p>
        {{TOC}}
      </nav>
    </aside>

    <article>
      <header class="document-header">
        <p class="kicker">LLM output / reader edition</p>
        <p class="document-title">{{TITLE}}</p>
        <p class="subtitle">{{SUBTITLE}}</p>
        <div class="meta">
          <span>{{WORD_COUNT}} words</span>
          <span>{{READING_TIME}} min read</span>
          <span>Source: {{SOURCE_LABEL}}</span>
        </div>
      </header>

      <section class="content">{{CONTENT}}</section>
      <footer class="footer">Generated {{GENERATED_AT}} · Self-contained HTML · No external assets</footer>
    </article>
  </main>

  <script>
    const root = document.documentElement;
    const savedTheme = localStorage.getItem("reader-theme");
    if (savedTheme) root.dataset.theme = savedTheme;

    document.getElementById("themeButton").addEventListener("click", () => {
      const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = nextTheme;
      localStorage.setItem("reader-theme", nextTheme);
    });

    const progress = document.getElementById("progress");
    function updateProgress() {
      const available = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = `${available > 0 ? (window.scrollY / available) * 100 : 0}%`;
    }
    document.addEventListener("scroll", updateProgress, { passive: true });
    updateProgress();

    async function copyText(value) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
        return;
      }
      const helper = document.createElement("textarea");
      helper.value = value;
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.appendChild(helper);
      helper.select();
      document.execCommand("copy");
      helper.remove();
    }

    document.querySelectorAll(".copy-code").forEach((button) => {
      button.addEventListener("click", async () => {
        const code = button.closest(".code-shell").querySelector("code").textContent;
        await copyText(code);
        button.textContent = "Copied";
        setTimeout(() => { button.textContent = "Copy"; }, 1200);
      });
    });

    const links = [...document.querySelectorAll(".toc-link")];
    const headings = links.map((link) => document.querySelector(link.getAttribute("href"))).filter(Boolean);
    if (headings.length) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          links.forEach((link) => link.classList.toggle("active", link.getAttribute("href") === `#${entry.target.id}`));
        });
      }, { rootMargin: "-15% 0px -70% 0px" });
      headings.forEach((heading) => observer.observe(heading));
    }
  </script>
</body>
</html>
